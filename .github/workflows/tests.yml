name: CPU checks
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m training.run --steps 2 --allow-random-llm --allow-random-vision --output runs/ci
      - run: python -m torch.distributed.run --standalone --nproc_per_node=2 -m training.run --allow-random-llm --allow-random-vision --steps 3 --accumulation 2 --output runs/ci-ddp
